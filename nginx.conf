server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Gzip
  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/font-woff font/woff2;

  # A API e os uploads são servidos pelo backend no mesmo host — em produção o
  # frontend usa apiUrl '/api', então o proxy abaixo evita CORS e cookies cross-site.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A validação de CSV é Server-Sent Events: não pode bufferizar nem cortar por timeout.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /uploads/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
  }

  # SPA fallback — todas as rotas Angular caem no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache imutável de assets com hash
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html nunca em cache (controla as versões dos assets)
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires 0;
  }
}
