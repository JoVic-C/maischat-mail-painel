<button
  #trigger
  type="button"
  class="rm-trigger"
  [class.is-open]="open"
  [class.has-text]="triggerText"
  [class.is-nav]="tone === 'nav'"
  [class.is-active]="active"
  [attr.aria-label]="triggerText ? null : label"
  aria-haspopup="menu"
  [attr.aria-expanded]="open"
  (click)="toggle()"
>
  <ng-container *ngIf="triggerText; else pontos">
    <!-- Elemento próprio: corta o texto com reticências sem levar a seta junto. -->
    <span class="rm-texto">{{ triggerText }}</span>
    <span class="rm-seta" aria-hidden="true"></span>
  </ng-container>
  <ng-template #pontos><span aria-hidden="true">⋯</span></ng-template>
</button>

<div
  class="rm-panel"
  *ngIf="open"
  role="menu"
  [attr.aria-label]="label"
  [style.top.px]="top"
  [style.bottom.px]="bottom"
  [style.right.px]="right"
  [class.is-placed]="positioned"
  (click)="onPanelClick($event)"
>
  <ng-content></ng-content>
</div>
