      --t:#1A1D21;--t2:#4A5568;
      --bg:#E9EDF7;--c:#FFF;--br:#DDE3F0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; background:var(--bg); color:var(--t); }
