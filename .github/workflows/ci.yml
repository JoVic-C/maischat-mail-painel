name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Auditoria e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Só dependências de produção: é o que vai para o navegador do cliente.
      # Falha em vulnerabilidade alta/crítica; moderadas não bloqueiam.
      - name: Auditoria de dependências
        run: npm run audit:ci

      - name: Build de produção
        run: npm run build:prod

  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Só o Chromium: os specs rodam num projeto só, e baixar os três navegadores
      # triplicaria o tempo do job sem cobrir nada a mais.
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      # A API é dublada no navegador (e2e/fixtures/api-mock.ts), então este job não
      # precisa de Mongo, Redis nem SMTP. O contrato do backend é coberto pelos
      # testes de integração do repositório da API.
      - name: Rodar E2E
        run: npm run test:e2e

      - name: Guardar o relatório quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
