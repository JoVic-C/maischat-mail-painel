<nav class="navbar" #barra [class.compacta]="compacto">
  <!-- Gatilho do painel recolhido. Só existe em tela estreita, onde os links saem da barra. -->
  <button
    *ngIf="compacto"
    type="button"
    class="nav-burger"
    [class.is-open]="menuAberto"
    aria-label="Menu de navegação"
    aria-controls="nav-painel"
    [attr.aria-expanded]="menuAberto"
    (click)="alternarMenu()"
  >
    <span aria-hidden="true"></span>
    <span aria-hidden="true"></span>
    <span aria-hidden="true"></span>
  </button>

  <a class="nav-brand" routerLink="/dashboard" aria-label="mMail — ir para o dashboard">
    <!-- Na barra compacta a assinatura inteira briga por espaço com o chip do cliente;
         o símbolo sozinho identifica a marca e devolve a largura para eles. -->
    <app-logo [variant]="compacto ? 'mark' : 'full'" size="21px" markColor="brand"></app-logo>
  </a>

  <!-- Barra larga: o trabalho do dia a dia fica à vista; o resto, em agrupamentos. -->
  <div class="nav-links" #links *ngIf="!compacto">
    <ng-container *ngIf="auth.hasTenantContext">
      <a routerLink="/dashboard" routerLinkActive="active">dashboard</a>
      <a routerLink="/lists" routerLinkActive="active">listas</a>
      <a routerLink="/contacts" routerLinkActive="active">contatos</a>
      <a routerLink="/templates" routerLinkActive="active">templates</a>
      <a routerLink="/campaigns" routerLinkActive="active">campanhas</a>
      <a routerLink="/segments" routerLinkActive="active">segmentos</a>

      <!-- Administração DO CLIENTE: entra-se aqui de vez em quando, não todo dia. -->
      <app-row-menu
        *ngIf="auth.isAdmin"
        tone="nav"
        triggerText="ajustes"
        label="Ajustes do cliente"
        [active]="emGrupo(['/smtp', '/equipe'])"
      >
        <a class="menu-item" routerLink="/smtp" routerLinkActive="active">SMTP</a>
        <a class="menu-item" routerLink="/equipe" routerLinkActive="active">Equipe</a>
      </app-row-menu>
    </ng-container>

    <!-- Administração DA PLATAFORMA: outro escopo, por isso separado dos links do cliente. -->
    <app-row-menu
      *ngIf="auth.isSuperadmin"
      tone="nav"
      triggerText="plataforma"
      label="Administração da plataforma"
      [active]="emGrupo(['/clientes', '/operacao', '/plataforma'])"
    >
      <a class="menu-item" routerLink="/clientes" routerLinkActive="active">Clientes</a>
      <a class="menu-item" routerLink="/operacao" routerLinkActive="active">Operação</a>
      <a class="menu-item" routerLink="/plataforma" routerLinkActive="active">Motor de envio</a>
    </app-row-menu>
  </div>

  <div class="nav-user" #usuario>
    <!-- Modo "operando em X": precisa parecer um estado ativo com saída, não um rótulo. -->
    <span class="tenant" *ngIf="auth.isSuperadmin && auth.activeTenantName">
      <span class="t-label">operando em</span>
      <span class="t-name" [title]="auth.activeTenantName">{{ auth.activeTenantName }}</span>
      <button type="button" class="t-exit" (click)="exitTenant()" title="Sair deste cliente" aria-label="Sair deste cliente">
        ✕
      </button>
    </span>

    <!-- Conta e saída num agrupamento só: eram dois alvos disputando a ponta da barra,
         logo ao lado do chip do cliente, que é o item mais largo dela. -->
    <app-row-menu
      *ngIf="auth.currentUser"
      tone="nav"
      [triggerText]="auth.currentUser.name || auth.currentUser.email"
      label="Sua conta"
      [active]="emGrupo(['/conta'])"
    >
      <a class="menu-item" routerLink="/conta" routerLinkActive="active">Minha conta</a>
      <div class="menu-sep" aria-hidden="true"></div>
      <button type="button" class="menu-item" (click)="auth.logout()">Sair</button>
    </app-row-menu>
  </div>

  <!-- Tela estreita: um painel com tudo, em seções. Substitui a rolagem horizontal,
       que escondia itens sem dar nenhum sinal de que havia mais coisa. -->
  <div class="nav-painel" id="nav-painel" *ngIf="compacto && menuAberto">
    <ng-container *ngIf="auth.hasTenantContext">
      <a routerLink="/dashboard" routerLinkActive="active">dashboard</a>
      <a routerLink="/lists" routerLinkActive="active">listas</a>
      <a routerLink="/contacts" routerLinkActive="active">contatos</a>
      <a routerLink="/templates" routerLinkActive="active">templates</a>
      <a routerLink="/campaigns" routerLinkActive="active">campanhas</a>
      <a routerLink="/segments" routerLinkActive="active">segmentos</a>

      <ng-container *ngIf="auth.isAdmin">
        <p class="np-secao">Ajustes</p>
        <a routerLink="/smtp" routerLinkActive="active">SMTP</a>
        <a routerLink="/equipe" routerLinkActive="active">Equipe</a>
      </ng-container>
    </ng-container>

    <ng-container *ngIf="auth.isSuperadmin">
      <p class="np-secao">Plataforma</p>
      <a routerLink="/clientes" routerLinkActive="active">Clientes</a>
      <a routerLink="/operacao" routerLinkActive="active">Operação</a>
      <a routerLink="/plataforma" routerLinkActive="active">Motor de envio</a>
    </ng-container>
  </div>
</nav>

<!-- Fundo do painel recolhido: fecha ao tocar fora e escurece a página, deixando claro
     que a navegação está por cima do conteúdo. -->
<div class="nav-fundo" *ngIf="compacto && menuAberto" (click)="fecharMenu()" aria-hidden="true"></div>
